services:
  webrtc-player:
    build: .
    ports:
      - "8088:8088"
      - "20000-20100:20000-20100/udp"
    environment:
      # Optional: override the default room (1)
      - ROOM_ID=${ROOM_ID:-}
    # For WebRTC connectivity behind NAT, you may need:
    # network_mode: host
    restart: unless-stopped

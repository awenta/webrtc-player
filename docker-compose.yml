services:
  webrtc-player:
    build: .
    ports:
      - "8088:8088"
      - "5004:5004/udp"
      - "5005:5005/udp"
      - "20000-20100:20000-20100/udp"
    environment:
      - STREAM_ID=${STREAM_ID:-1}
      - VIDEO_PORT=${VIDEO_PORT:-5004}
      - AUDIO_PORT=${AUDIO_PORT:-5005}
      # Set to the IP the browser uses to reach this host.
      # Auto-detected if not set, but set explicitly for remote/cloud deployments.
      - PUBLIC_IP=${PUBLIC_IP:-}
    # Alternative: use host networking to avoid NAT issues entirely
    # network_mode: host
    restart: unless-stopped

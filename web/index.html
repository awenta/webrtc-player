<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC Player</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #player {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #aaa; font-family: system-ui, sans-serif; font-size: 1.2rem;
    pointer-events: none;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>

<video id="player" autoplay playsinline muted></video>
<div id="overlay">Connecting…</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var streamId = parseInt(params.get("stream") || "1", 10);
  var wsUrl = params.get("ws") || ((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");

  var video = document.getElementById("player");
  var overlay = document.getElementById("overlay");

  var ws, pc, keepAlive;

  function log() {
    var args = Array.prototype.slice.call(arguments);
    args.unshift("[player]");
    console.log.apply(console, args);
  }

  function showStatus(msg) {
    overlay.textContent = msg;
    overlay.classList.remove("hidden");
  }

  function hideOverlay() {
    overlay.classList.add("hidden");
  }

  function send(msg) {
    var payload = JSON.stringify(msg);
    log("→", payload);
    ws.send(payload);
  }

  function tx() {
    return Math.random().toString(36).substring(2, 10);
  }

  function connect() {
    showStatus("Connecting…");
    cleanup();

    ws = new WebSocket(wsUrl, "janus-protocol");

    ws.onopen = function() {
      log("WebSocket connected");
      send({ janus: "create", transaction: tx() });
    };

    ws.onclose = function() {
      log("WebSocket closed, reconnecting in 3s…");
      showStatus("Disconnected. Reconnecting…");
      setTimeout(connect, 3000);
    };

    ws.onerror = function(e) {
      log("WebSocket error", e);
    };

    var sessionId = null;
    var handleId = null;

    ws.onmessage = function(evt) {
      var msg = JSON.parse(evt.data);
      log("←", JSON.stringify(msg));

      if (msg.janus === "success" && !sessionId) {
        sessionId = msg.data.id;
        log("Session:", sessionId);
        send({
          janus: "attach",
          plugin: "janus.plugin.streaming",
          session_id: sessionId,
          transaction: tx()
        });
        keepAlive = setInterval(function() {
          if (ws.readyState === 1) {
            send({ janus: "keepalive", session_id: sessionId, transaction: tx() });
          }
        }, 25000);
        return;
      }

      if (msg.janus === "success" && sessionId && !handleId && msg.data && msg.data.id) {
        handleId = msg.data.id;
        log("Handle:", handleId);
        send({
          janus: "message",
          session_id: sessionId,
          handle_id: handleId,
          transaction: tx(),
          body: { request: "watch", id: streamId }
        });
        return;
      }

      if (msg.janus === "event" && msg.jsep) {
        handleOffer(sessionId, handleId, msg.jsep);
        return;
      }

      if (msg.janus === "hangup" || msg.janus === "detached") {
        log("Stream ended, retrying in 3s…");
        showStatus("Stream ended. Reconnecting…");
        cleanup();
        setTimeout(connect, 3000);
        return;
      }

      if (msg.janus === "error") {
        var errMsg = msg.error ? msg.error.reason : "Unknown error";
        log("Error:", errMsg);
        showStatus("Error: " + errMsg);
      }
    };
  }

  async function handleOffer(sessionId, handleId, jsep) {
    showStatus("Starting playback…");
    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    pc.ontrack = function(evt) {
      log("Track received:", evt.track.kind);
      if (video.srcObject !== evt.streams[0]) {
        video.srcObject = evt.streams[0];
        video.play().then(hideOverlay).catch(function() {
          showStatus("Click to play");
          overlay.style.pointerEvents = "auto";
          overlay.style.cursor = "pointer";
          overlay.onclick = function() {
            video.play().then(hideOverlay);
            overlay.style.pointerEvents = "none";
          };
        });
      }
    };

    pc.onicecandidate = function(evt) {
      if (evt.candidate) {
        send({
          janus: "trickle",
          session_id: sessionId,
          handle_id: handleId,
          transaction: tx(),
          candidate: evt.candidate
        });
      } else {
        send({
          janus: "trickle",
          session_id: sessionId,
          handle_id: handleId,
          transaction: tx(),
          candidate: { completed: true }
        });
      }
    };

    pc.oniceconnectionstatechange = function() {
      log("ICE state:", pc.iceConnectionState);
      if (pc.iceConnectionState === "failed" || pc.iceConnectionState === "disconnected") {
        showStatus("Connection lost. Reconnecting…");
        cleanup();
        setTimeout(connect, 3000);
      }
    };

    await pc.setRemoteDescription(new RTCSessionDescription(jsep));
    var answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    send({
      janus: "message",
      session_id: sessionId,
      handle_id: handleId,
      transaction: tx(),
      body: { request: "start" },
      jsep: { type: answer.type, sdp: answer.sdp }
    });
  }

  function cleanup() {
    if (keepAlive) { clearInterval(keepAlive); keepAlive = null; }
    if (pc) { pc.close(); pc = null; }
    if (ws && ws.readyState < 2) { ws.onclose = null; ws.close(); }
    ws = null;
  }

  connect();
})();
</script>
</body>
</html>

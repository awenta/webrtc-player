<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC Player</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #player {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #aaa; font-family: system-ui, sans-serif; font-size: 1.2rem;
    pointer-events: none;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>

<video id="player" autoplay playsinline muted></video>
<div id="overlay">Waiting for stream…</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var roomId = parseInt(params.get("room") || "1", 10);
  var wsUrl = params.get("ws") || ((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");

  var video = document.getElementById("player");
  var overlay = document.getElementById("overlay");

  var ws, sessionId, handleId, privateId, subscriberHandle, pc, keepAlive;

  function log() {
    var args = Array.prototype.slice.call(arguments);
    args.unshift("[player]");
    console.log.apply(console, args);
  }

  function showStatus(msg) {
    overlay.textContent = msg;
    overlay.classList.remove("hidden");
  }

  function hideOverlay() {
    overlay.classList.add("hidden");
  }

  function tx() {
    return Math.random().toString(36).substring(2, 10);
  }

  function send(msg) {
    log("→", JSON.stringify(msg));
    ws.send(JSON.stringify(msg));
  }

  // Transaction callbacks
  var transactions = {};

  function sendWithCb(msg, cb) {
    var t = tx();
    msg.transaction = t;
    transactions[t] = cb;
    send(msg);
  }

  function connect() {
    showStatus("Connecting…");
    cleanup();

    ws = new WebSocket(wsUrl, "janus-protocol");

    ws.onopen = function() {
      log("WebSocket connected");
      createSession();
    };

    ws.onclose = function() {
      log("WebSocket closed, reconnecting in 3s…");
      showStatus("Disconnected. Reconnecting…");
      setTimeout(connect, 3000);
    };

    ws.onerror = function(e) {
      log("WebSocket error", e);
    };

    ws.onmessage = function(evt) {
      var msg = JSON.parse(evt.data);
      log("←", JSON.stringify(msg));

      // Handle transaction callbacks
      if (msg.transaction && transactions[msg.transaction]) {
        transactions[msg.transaction](msg);
        delete transactions[msg.transaction];
        return;
      }

      // Handle events on the subscriber handle
      if (msg.sender === subscriberHandle) {
        handleSubscriberEvent(msg);
        return;
      }

      // Handle events on the publisher handle (we join as listener, watch for publishers)
      if (msg.sender === handleId) {
        handlePublisherEvent(msg);
        return;
      }
    };
  }

  function createSession() {
    sendWithCb({ janus: "create" }, function(msg) {
      if (msg.janus !== "success") {
        showStatus("Error creating session");
        return;
      }
      sessionId = msg.data.id;
      log("Session:", sessionId);

      // Keep-alive
      keepAlive = setInterval(function() {
        if (ws && ws.readyState === 1) {
          send({ janus: "keepalive", session_id: sessionId, transaction: tx() });
        }
      }, 25000);

      attachPublisherHandle();
    });
  }

  function attachPublisherHandle() {
    sendWithCb({
      janus: "attach",
      plugin: "janus.plugin.videoroom",
      session_id: sessionId
    }, function(msg) {
      if (msg.janus !== "success") {
        showStatus("Error attaching plugin");
        return;
      }
      handleId = msg.data.id;
      log("Publisher handle:", handleId);
      joinAsSubscriberListener();
    });
  }

  function joinAsSubscriberListener() {
    showStatus("Waiting for stream…");
    sendWithCb({
      janus: "message",
      session_id: sessionId,
      handle_id: handleId,
      body: { request: "join", ptype: "publisher", room: roomId }
    }, function(msg) {
      if (msg.janus === "event" && msg.plugindata) {
        var data = msg.plugindata.data;
        if (data.videoroom === "joined") {
          privateId = data.private_id;
          log("Joined room, private_id:", privateId);
          // Check if there are already publishers
          if (data.publishers && data.publishers.length > 0) {
            subscribeToFeed(data.publishers[0].id);
          } else {
            showStatus("Waiting for publisher…");
          }
        }
      }
    });
  }

  function handlePublisherEvent(msg) {
    if (msg.janus !== "event" || !msg.plugindata) return;
    var data = msg.plugindata.data;

    // New publisher arrived
    if (data.videoroom === "event" && data.publishers && data.publishers.length > 0) {
      log("Publisher joined:", data.publishers[0].id);
      if (!subscriberHandle) {
        subscribeToFeed(data.publishers[0].id);
      }
    }

    // Publisher left
    if (data.videoroom === "event" && data.unpublished) {
      log("Publisher left:", data.unpublished);
      if (subscriberHandle) {
        showStatus("Publisher disconnected. Waiting…");
        // Detach subscriber, wait for new publisher
        send({
          janus: "detach",
          session_id: sessionId,
          handle_id: subscriberHandle,
          transaction: tx()
        });
        subscriberHandle = null;
        if (pc) { pc.close(); pc = null; }
        video.srcObject = null;
      }
    }
  }

  function subscribeToFeed(feedId) {
    log("Subscribing to feed:", feedId);
    showStatus("Starting playback…");

    sendWithCb({
      janus: "attach",
      plugin: "janus.plugin.videoroom",
      session_id: sessionId
    }, function(msg) {
      if (msg.janus !== "success") return;
      subscriberHandle = msg.data.id;
      log("Subscriber handle:", subscriberHandle);

      sendWithCb({
        janus: "message",
        session_id: sessionId,
        handle_id: subscriberHandle,
        body: {
          request: "join",
          ptype: "subscriber",
          room: roomId,
          feed: feedId,
          private_id: privateId
        }
      }, function(msg) {
        if (msg.jsep) {
          handleOffer(msg.jsep);
        }
      });
    });
  }

  function handleSubscriberEvent(msg) {
    if (msg.jsep) {
      handleOffer(msg.jsep);
    }
  }

  async function handleOffer(jsep) {
    if (pc) { pc.close(); }

    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    pc.ontrack = function(evt) {
      log("Track received:", evt.track.kind);
      if (video.srcObject !== evt.streams[0]) {
        video.srcObject = evt.streams[0];
        video.play().then(hideOverlay).catch(function() {
          showStatus("Click to play");
          overlay.style.pointerEvents = "auto";
          overlay.style.cursor = "pointer";
          overlay.onclick = function() {
            video.play().then(hideOverlay);
            overlay.style.pointerEvents = "none";
          };
        });
      }
    };

    pc.onicecandidate = function(evt) {
      if (evt.candidate) {
        send({
          janus: "trickle",
          session_id: sessionId,
          handle_id: subscriberHandle,
          transaction: tx(),
          candidate: evt.candidate
        });
      } else {
        send({
          janus: "trickle",
          session_id: sessionId,
          handle_id: subscriberHandle,
          transaction: tx(),
          candidate: { completed: true }
        });
      }
    };

    pc.oniceconnectionstatechange = function() {
      log("ICE state:", pc.iceConnectionState);
      if (pc.iceConnectionState === "failed") {
        showStatus("Connection failed. Reconnecting…");
        cleanup();
        setTimeout(connect, 3000);
      }
    };

    await pc.setRemoteDescription(new RTCSessionDescription(jsep));
    var answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    sendWithCb({
      janus: "message",
      session_id: sessionId,
      handle_id: subscriberHandle,
      body: { request: "start" },
      jsep: { type: answer.type, sdp: answer.sdp }
    }, function(msg) {
      log("Playback started");
    });
  }

  function cleanup() {
    if (keepAlive) { clearInterval(keepAlive); keepAlive = null; }
    if (pc) { pc.close(); pc = null; }
    if (ws && ws.readyState < 2) { ws.onclose = null; ws.close(); }
    ws = null;
    sessionId = null;
    handleId = null;
    subscriberHandle = null;
    privateId = null;
    transactions = {};
  }

  connect();
})();
</script>
</body>
</html>
